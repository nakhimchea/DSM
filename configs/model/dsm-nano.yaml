# DSM-nano: the full DSM layout (3 Gated DeltaNet : 1 gated attention, zero-centred
# norms, partial RoPE, tied embeddings) at ~160M parameters, for demonstrating
# pre-training FROM SCRATCH on one GPU (configs/train/pt_nano_24gb.yaml).
# It reuses the DSM tokenizer, so 127M of the parameters are the 248K-row embedding.
vocab_size: 248320
hidden_size: 512
intermediate_size: 1536
num_hidden_layers: 8
full_attention_interval: 4
num_attention_heads: 8
num_key_value_heads: 2
head_dim: 64
linear_num_key_heads: 8
linear_num_value_heads: 8
linear_key_head_dim: 64
linear_value_head_dim: 64
linear_conv_kernel_dim: 4
tie_word_embeddings: true
max_position_embeddings: 32768
rope_parameters:
  rope_type: default
  rope_theta: 10000000.0
  partial_rotary_factor: 0.25
  mrope_section: [3, 3, 2]
  mrope_interleaved: true
eos_token_id: 248046
pad_token_id: 248044
initializer_range: 0.02
