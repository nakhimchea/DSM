# v0.1 fast path: SFT the converted INSTRUCT checkpoint on DSM's own data
# (identity, safety, tools, tables, formatting, RAG) plus general replay.
# ~30K conversations x 2 epochs, ~1-2 h on a 24 GB GPU.
stage: sft
model: work/models/dsm-instruct
output_dir: work/runs/fastpath_sft
data:
  train:
    - {path: datasets/sft/seeds/identity/identity_sft.jsonl.zst, repeat: 4}
    - {path: datasets/sft/seeds/safety/safety_sft.jsonl.zst, repeat: 3}
    - {path: datasets/sft/seeds/tools.jsonl.zst}
    - {path: datasets/sft/seeds/tables.jsonl.zst}
    - {path: datasets/sft/seeds/formatting.jsonl.zst, repeat: 2}
    - {path: datasets/sft/seeds/rag.jsonl.zst, repeat: 2}
    - {path: "datasets/sft/chat/*.jsonl.zst", repeat: 0.1}  # 10 % of the general chats: keeps old skills
sft: {train_on: all, packing: true}
epochs: 2
seq_len: 4096
micro_batch_size: 4
grad_accum: 4                       # 4 x 4096 x 4 = 64K token slots per step
optimizer: {lr: 1.0e-5, weight_decay: 0.0, betas: [0.9, 0.95], grad_clip: 1.0}
schedule: {name: cosine, warmup: 0.03, min_lr_ratio: 0.1}
precision: bf16
gradient_checkpointing: true
log_every: 10
eval_every: 100
save_every: 200
save_dtype: bfloat16
